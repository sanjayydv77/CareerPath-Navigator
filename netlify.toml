# Netlify Configuration for Future-Fit Frontend
[build]
  # Explicitly set base and publish directories
  base = ""
  publish = "."
  command = ""
  
[build.environment]
  NODE_VERSION = "18"

# Redirect all 404s to index.html for SPA behavior
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
